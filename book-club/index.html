<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="canonical" href="https://shanegolden.ca/book-club/">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Club</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo {
      width: 48px;
      height: 48px;
      margin-bottom: 0.75rem;
    }

    .title {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #1d1d1f;
    }

    main {
      background-color: #fff;
      padding: 3rem 2rem;
      border-radius: 20px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      color: #1d1d1f;
    }

    input {
      width: 100%;
      padding: 0.9rem 1rem;
      margin: 0.6rem 0;
      border-radius: 12px;
      border: 1px solid #d2d2d7;
      background-color: #f5f5f7;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: #0071e3;
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.3);
    }

    button {
      width: 100%;
      padding: 0.9rem;
      margin-top: 1rem;
      background-color: #0071e3;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #005bb5;
    }

    .login-signup-tabs {
      position: relative;
      display: flex;
      justify-content: space-around;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      font-weight: 500;
      border-bottom: 1px solid #d2d2d7;
    }

    .login-signup-tabs div {
      padding: 0.5rem 1rem;
      cursor: pointer;
      color: #6e6e73;
      transition: color 0.2s ease;
      z-index: 1;
    }

    .login-signup-tabs .active {
      color: #1d1d1f;
    }

    .tab-underline {
      position: absolute;
      bottom: 0;
      height: 2px;
      width: 50%;
      background-color: #0071e3;
      transition: transform 0.3s ease;
      border-radius: 2px 2px 0 0;
    }

    p.message {
      text-align: center;
      color: #e30000;
      margin-top: 1.2rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 19.5V6.75C4 5.645 4.895 4.75 6 4.75h12c1.105 0 2 .895 2 2v12.75M4 19.5c0 1.105.895 2 2 2h6M4 19.5h6m0 0V6.75m0 14.75h6c1.105 0 2-.895 2-2M12 21.5V6.75" />
    </svg>
    <div class="title">Book Club</div>
  </header>

  <main>
    <div class="login-signup-tabs">
      <div id="tabLogin" class="active">Log In</div>
      <div id="tabSignup">Sign Up</div>
      <div class="tab-underline"></div>
    </div>

    <div id="authForm"></div>
    <p class="message" id="message"></p>
  </main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyARFfiXUa27jTt2nfuStSGZL4HCCp5oPx0",
    authDomain: "book-club-f42b1.firebaseapp.com",
    projectId: "book-club-f42b1",
    storageBucket: "book-club-f42b1.appspot.com",
    messagingSenderId: "85630091573",
    appId: "1:85630091573:web:427077f1351140fc278c7c",
    measurementId: "G-8BD4H79Z5Q"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const authFormDiv = document.getElementById("authForm");
  const messageP = document.getElementById("message");
  const tabSignup = document.getElementById("tabSignup");
  const tabLogin = document.getElementById("tabLogin");
  const tabUnderline = document.querySelector(".tab-underline");

  function renderSignup() {
    authFormDiv.innerHTML = `
      <h2>Create Account</h2>
      <input id="name" placeholder="Full name" />
      <input id="email" placeholder="Email" type="email" />
      <input id="password" placeholder="Password" type="password" />
      <button id="signupBtn">Sign Up</button>
    `;
    messageP.innerText = "";

    document.getElementById("signupBtn").addEventListener("click", async () => {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!name || !email || !password) {
        messageP.innerText = "Please fill all fields.";
        return;
      }

      try {
        const userCred = await createUserWithEmailAndPassword(auth, email, password);
        const uid = userCred.user.uid;

        await setDoc(doc(db, "members", uid), {
          name,
          email,
          approved: false,
          role: "member",
          appliedAt: new Date()
        });

        messageP.innerText = "Signup successful! Waiting for admin approval.";
      } catch (err) {
        console.error(err);
        messageP.innerText = err.message;
      }
    });
  }

  function renderLogin() {
    authFormDiv.innerHTML = `
      <h2>Welcome Back</h2>
      <input id="loginEmail" placeholder="Email" type="email" />
      <input id="loginPassword" placeholder="Password" type="password" />
      <button id="loginBtn">Log In</button>
    `;
    messageP.innerText = "";

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const uid = cred.user.uid;

        const memberSnap = await getDoc(doc(db, "members", uid));
        if (!memberSnap.exists()) {
          await signOut(auth);
          messageP.innerText = "No membership application found. Please apply first.";
          return;
        }

        const data = memberSnap.data();
        if (!data.approved) {
          await signOut(auth);
          messageP.innerText = "Your application is still pending approval.";
          return;
        }

        if (data.role === "admin") {
          window.location.href = "/books/admin.html";
        } else {
          window.location.href = "/books/dashboard.html";
        }
      } catch (err) {
        console.error(err);
        messageP.innerText = err.message;
      }
    });
  }

  function moveUnderline(tab) {
    if (tab === "login") {
      tabUnderline.style.transform = "translateX(0%)";
    } else {
      tabUnderline.style.transform = "translateX(100%)";
    }
  }

  tabSignup.addEventListener("click", () => {
    tabSignup.classList.add("active");
    tabLogin.classList.remove("active");
    moveUnderline("signup");
    renderSignup();
  });

  tabLogin.addEventListener("click", () => {
    tabLogin.classList.add("active");
    tabSignup.classList.remove("active");
    moveUnderline("login");
    renderLogin();
  });

  renderLogin();
  moveUnderline("login");
</script>
</body>
</html>
